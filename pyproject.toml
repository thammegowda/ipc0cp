[build-system]
requires = ["setuptools>=61.0", "wheel", "cmake>=3.18"]
build-backend = "setuptools.build_meta"

[project]
name = "ipc0cp"
version = "0.1.0"
description = "Zero-copy inter-process communication between Python and C++"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Thamme Gowda"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]
keywords = ["ipc", "shared-memory", "zero-copy", "interprocess", "python", "cpp"]
dependencies = [
    "numpy>=1.20.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-timeout>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/thammegowda/ipc0cp"
Repository = "https://github.com/thammegowda/ipc0cp"
Issues = "https://github.com/thammegowda/ipc0cp/issues"

[tool.setuptools.packages.find]
where = ["python"]
include = ["ipc0cp*"]
exclude = ["tests*", "docs*"]
